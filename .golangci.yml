version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gocritic
    - gosec
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-tags:
        - style
        - experimental
        - opinionated
    gosec:
      excludes:
        # G104: Unhandled errors — acceptable in sim/demo code and test files
        - G104
        # G101: Hardcoded credentials — the demo master key is intentional/documented
        - G101
  exclusions:
    rules:
      # Allow unhandled errors in main.go and sim entry points
      - path: cmd/
        linters:
          - errcheck
      # Allow unused parameters in test files
      - path: _test\.go
        linters:
          - unused

formatters:
  enable:
    - gofmt