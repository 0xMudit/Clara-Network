services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clara
      POSTGRES_PASSWORD: clara
      POSTGRES_DB: clara
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clara -d clara"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  switch:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["switch"]
    environment:
      CLARA_LISTEN: ":8080"
      CLARA_HEALTH_ADDR: ":8084"
      CLARA_ISSUER_ROUTES: '{"1000001000":"issuer-sim:8082"}'
      CLARA_BIN_TABLE: '{"entries":{"400000":"1000001000"}}'
      CLARA_RISK_RULES: '{"rules":[{"name":"card-velocity","kind":"velocity-card","limit":5,"window":60,"code":"59","enabled":true}]}'
      CLARA_REDIS_ADDR: "redis:6379"
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
    ports:
      - "18080:8080"
      - "18084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      issuer-sim:
        condition: service_started

  issuer-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["issuer-sim"]
    environment:
      CLARA_LISTEN: ":8082"
      CLARA_ID: "1000001000"

  acquirer-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["acquirer-sim"]
    environment:
      CLARA_SWITCH: "switch:8080"
      CLARA_ACQUIRER_ID: "1000001"
      CLARA_ISSUER_ID: "1000001000"
      CLARA_PAN: "4000001234567890"
      CLARA_SEND_DE100: "false"
      CLARA_COUNT: "6"
      CLARA_AMOUNT: "1000"
      CLARA_STEP: "2500"
    depends_on:
      switch:
        condition: service_started
    restart: "no"

  clearing-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["clearing-sim"]
    environment:
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
      CLARA_SCENARIO: "default"
      CLARA_OUT: "/out/clearing"
    volumes:
      - clearing-out:/out/clearing
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ledger-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["ledger-sim"]
    environment:
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
      CLARA_SCENARIO: "default"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cardsvc:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["cardsvc"]
    environment:
      CLARA_LISTEN: ":8081"
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
      CLARA_ISSUER_MASTER_KEY: "2b7e151628aed2a6abf7158809cf4f3c"
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  card-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["card-sim"]
    environment:
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
      CLARA_PAN: "4000001234567899"
    depends_on:
      cardsvc:
        condition: service_started
    restart: "no"

  acquiring-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["acquiring-sim"]
    environment:
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  disputes-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["disputes-sim"]
    environment:
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hsm-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["hsm-sim"]
    restart: "no"

  resilience-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["resilience-sim"]
    restart: "no"

  instant-sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["instant-sim"]
    restart: "no"

  adminapi:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["adminapi"]
    environment:
      CLARA_LISTEN: ":8083"
      CLARA_PG_DSN: "postgres://clara:clara@postgres:5432/clara?sslmode=disable"
    ports:
      - "18083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  clearing-out:
